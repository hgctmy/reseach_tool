name: Daily alphaXiv digest

on:
  workflow_dispatch:
    inputs:
      sort:
        description: "フィードのソート指定"
        required: false
        type: choice
        default: "ForYou"
        options:
          - "Hot"
          - "Comments"
          - "Views"
          - "Likes"
          - "GitHub"
          - "Recommended"
          - "ForYou"
          - "Recent"
      interval:
        description: "ランキング集計の対象期間"
        required: false
        type: choice
        default: "7 Days"
        options:
          - "3 Days"
          - "7 Days"
          - "30 Days"
          - "90 Days"
          - "All time"
      limit:
        description: "取得件数"
        required: false
        default: "5"
      full_text:
        description: "ONにするとPDF直リンク（本文まで読み込む）にする。OFFなら要旨ページ"
        required: false
        type: boolean
        default: false
  schedule:
    # 毎日 22:00 UTC = 日本時間 朝7:00
    - cron: "0 22 * * *"

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch today's papers
        env:
          ALPHAXIV_API_KEY: ${{ secrets.ALPHAXIV_API_KEY }}
        run: |
          args=(--sort "${{ github.event.inputs.sort || 'ForYou' }}" --interval "${{ github.event.inputs.interval || '7 Days' }}" --limit "${{ github.event.inputs.limit || '5' }}")
          if [ "${{ github.event.inputs.full_text }}" = "true" ]; then
            args+=(--full-text)
          fi
          python scripts/daily_digest.py "${args[@]}"

      - name: Show result in run summary
        run: |
          {
            echo "### 今日のURL一覧（NotebookLMのURL欄にそのまま貼り付ける）"
            echo '```'
            cat data/daily/*.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/daily/
          git diff --cached --quiet || git commit -m "daily digest: $(date -u +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
